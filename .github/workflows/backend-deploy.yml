
name: Library Backend CI/CD

on:
  push:
    branches: [DEV_MAIN]
    paths:
      - 'Lib_Management_System_BE/**'
      - '.github/workflows/backend-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: library-backend-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./Lib_Management_System_BE

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build Spring Boot JAR
        run: |
          chmod +x gradlew
          ./gradlew clean bootJar --no-daemon

      - name: Configure SSH
        working-directory: .
        env:
          SSH_KEY: ${{ secrets.VM_SSH_KEY }}
          HOST_KEY: ${{ secrets.VM_HOST_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$HOST_KEY" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Upload backend JAR
        working-directory: .
        env:
          HOST: ${{ secrets.VM_HOST }}
          USER: ${{ secrets.VM_USER }}
        run: |
          scp -i ~/.ssh/deploy_key \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            Lib_Management_System_BE/build/libs/Lib_Management_System_BE-0.0.1-SNAPSHOT.jar \
            "$USER@$HOST:/home/azureuser/Deployment/LibraryManagement/backend/Lib_Management_System_BE-0.0.1-SNAPSHOT.jar.new"

      - name: Deploy backend
        working-directory: .
        env:
          HOST: ${{ secrets.VM_HOST }}
          USER: ${{ secrets.VM_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$USER@$HOST" \
            'bash /home/azureuser/Deployment/LibraryManagement/scripts/deploy-backend.sh'
